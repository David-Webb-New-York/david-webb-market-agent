name: Probe Source (Browserbase)
# Two ways to trigger:
#  1. workflow_dispatch — only usable via the GitHub UI/API once this file is
#     merged to the default branch (a GitHub limitation: workflow_dispatch
#     targets aren't listed/dispatchable until they exist on the default
#     branch, even though the run itself can target another ref).
#  2. push to probe-request.json — works on ANY branch immediately (push
#     triggers evaluate the workflow file as of the pushed commit, no
#     default-branch registration needed), so this is how a feature branch
#     drives probes before merging. Edit probe-request.json and push.
on:
  push:
    paths:
      - 'probe-request.json'
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to render and inspect (e.g. a search/results page)'
        required: true
        type: string
      proxies:
        description: 'Use Browserbase proxies (paid plan; needed for Cloudflare-blocked sites)'
        type: boolean
        default: false
      stealth:
        description: 'Use Browserbase advanced stealth mode (fingerprint spoofing, for DataDome/PerimeterX-style bot detection)'
        type: boolean
        default: false
      wait_ms:
        description: 'Render wait time in ms before capturing state'
        type: string
        default: '8000'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Resolve inputs
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            {
              echo "url=${{ inputs.url }}"
              echo "proxies=${{ inputs.proxies }}"
              echo "stealth=${{ inputs.stealth }}"
              echo "wait_ms=${{ inputs.wait_ms }}"
            } >> "$GITHUB_OUTPUT"
          else
            node -e '
              const fs = require("fs");
              const r = require("./probe-request.json");
              fs.appendFileSync(process.env.GITHUB_OUTPUT,
                `url=${r.url}\nproxies=${!!r.proxies}\nstealth=${!!r.stealth}\nwait_ms=${r.wait_ms || 8000}\n`);
            '
          fi
      - name: Probe URL
        run: node bb-probe.js "${{ steps.resolve.outputs.url }}" ${{ steps.resolve.outputs.proxies == 'true' && '--proxies' || '' }} ${{ steps.resolve.outputs.stealth == 'true' && '--stealth' || '' }} --wait=${{ steps.resolve.outputs.wait_ms }}
        env:
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
      - name: Print findings to job log
        if: always()
        run: node print-probe-findings.js
      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-output
          path: probe-output/
          retention-days: 14
          if-no-files-found: warn
