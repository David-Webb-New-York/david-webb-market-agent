name: Plain Fetch Test (no Browserbase)
# One-off diagnostic: does a plain fetch() (real internet, no JS rendering)
# see the same server-rendered data Browserbase sees? If yes, we can skip
# Browserbase for sources where the data turns out to be server-rendered.
on:
  push:
    paths:
      - 'plain-fetch-test.js'
      - 'plain-post-test.js'
      - '.github/workflows/plain-fetch-test.yml'
      - 'plain-fetch-request.txt'
      - 'plain-post-request.json'
      - 'plain-post-request-2.json'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve URL
        id: resolve
        run: |
          if [ -f plain-fetch-request.txt ]; then
            echo "url=$(cat plain-fetch-request.txt)" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://www.liveauctioneers.com/search/?keyword=david+webb" >> "$GITHUB_OUTPUT"
          fi
      - name: GET test
        if: hashFiles('plain-fetch-request.txt') != ''
        run: node plain-fetch-test.js "${{ steps.resolve.outputs.url }}"
      - name: POST test (Invaluable catResults replay)
        if: hashFiles('plain-post-request.json') != ''
        run: node plain-post-test.js "https://www.invaluable.com/catResults" plain-post-request.json
      - name: POST test 2 (Invaluable catResults, alternate index)
        if: hashFiles('plain-post-request-2.json') != ''
        run: node plain-post-test.js "https://www.invaluable.com/catResults" plain-post-request-2.json
