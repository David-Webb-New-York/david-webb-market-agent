name: Plain Fetch Test (no Browserbase)
# One-off diagnostic: does a plain fetch() (real internet, no JS rendering)
# see the same server-rendered data Browserbase sees? If yes, we can skip
# Browserbase for sources where the data turns out to be server-rendered.
on:
  push:
    paths:
      - 'plain-fetch-test.js'
      - 'plain-post-test.js'
      - 'plain-json-get-test.js'
      - '.github/workflows/plain-fetch-test.yml'
      - 'plain-fetch-request.txt'
      - 'plain-post-request.json'
      - 'plain-post-request-3.json'
      - 'plain-post-request-4.json'
      - 'plain-post-request-5.json'
      - 'plain-post-headers-sothebys.json'
      - 'phillips-listing-shape.js'
      - 'doyle-listing-shape.js'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve URL
        id: resolve
        run: |
          if [ -f plain-fetch-request.txt ]; then
            echo "url=$(cat plain-fetch-request.txt)" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://www.liveauctioneers.com/search/?keyword=david+webb" >> "$GITHUB_OUTPUT"
          fi
      - name: GET test
        if: hashFiles('plain-fetch-request.txt') != ''
        run: node plain-fetch-test.js "${{ steps.resolve.outputs.url }}"
      - name: POST test (Invaluable catResults replay)
        if: hashFiles('plain-post-request.json') != ''
        run: node plain-post-test.js "https://www.invaluable.com/catResults" plain-post-request.json
      - name: POST test 3 (Bonhams Typesense search-proxy replay)
        if: hashFiles('plain-post-request-3.json') != ''
        run: node plain-post-test.js "https://api01.bonhams.com/search-proxy/multi_search?use_cache=true&enable_lazy_filter=true" plain-post-request-3.json
      - name: POST test 4 (Sotheby's Algolia replay, confirmed Buy Now query, regression check)
        if: hashFiles('plain-post-request-4.json') != ''
        run: node plain-post-test.js "https://o28sy4q7wu-dsn.algolia.net/1/indexes/*/queries" plain-post-request-4.json plain-post-headers-sothebys.json
      - name: POST test 5 (Sotheby's Algolia replay, type:Lot query -- real auction data?)
        if: hashFiles('plain-post-request-5.json') != ''
        run: node plain-post-test.js "https://o28sy4q7wu-dsn.algolia.net/1/indexes/*/queries" plain-post-request-5.json plain-post-headers-sothebys.json
      - name: GET test 6 (Christie's count-client, regression check -- confirms 2015 past-lot matches)
        if: hashFiles('plain-json-get-test.js') != ''
        run: node plain-json-get-test.js "https://apim.christies.com/count-client?Keyword=david%20webb&LanguageCode=en&Categories=%5B%22UpcomingLot%22%2C%22PastLot%22%2C%22Story%22%5D"
      - name: GET test 7 (Christie's search-client with is_past_lots=True -- real lot listing data?)
        if: hashFiles('plain-json-get-test.js') != ''
        run: node plain-json-get-test.js "https://apim.christies.com/search-client?keyword=david%20webb&page=1&is_past_lots=True&sortby=relevance&language=en&geocountrycode=US"
      - name: GET test 8 (Christie's search-client is_past_lots=True, full real param set + correlation-id/source-application headers)
        if: hashFiles('plain-json-get-test.js') != ''
        run: |
          node plain-json-get-test.js \
            "https://apim.christies.com/search-client?keyword=david%20webb&page=1&is_past_lots=True&sortby=relevance&language=en&geocountrycode=US&show_on_loan=true&datasourceId=182f8bb2-d729-4a38-b539-7cf1a901cf2e" \
            "correlation-id: 11111111-1111-4111-8111-111111111111" \
            "source-application: gsrp"
      - name: GET test 9 (Christie's search-client is_past_lots=True, same as test 8 + Referer/Origin -- confirmed live browser call succeeded with the test-8 headers alone, so this isolates whether a boilerplate header our capture filters out, not a custom one, is the real gate)
        if: hashFiles('plain-json-get-test.js') != ''
        run: |
          node plain-json-get-test.js \
            "https://apim.christies.com/search-client?keyword=david%20webb&page=1&is_past_lots=True&sortby=relevance&language=en&geocountrycode=US&show_on_loan=true&datasourceId=182f8bb2-d729-4a38-b539-7cf1a901cf2e" \
            "correlation-id: 11111111-1111-4111-8111-111111111111" \
            "source-application: gsrp" \
            "Referer: https://www.christies.com/" \
            "Origin: https://www.christies.com"
      - name: Phillips listing markup shape (confirmed free plain-fetch source, need real card markup to build an adapter)
        if: hashFiles('phillips-listing-shape.js') != ''
        run: node phillips-listing-shape.js "https://www.phillips.com/Search?Search=david+webb"
      - name: Doyle search-results page -- is it server-rendered too?
        if: hashFiles('doyle-listing-shape.js') != ''
        run: node doyle-listing-shape.js "https://www.doyle.com/auction/search/?st=david+webb&c=1"
