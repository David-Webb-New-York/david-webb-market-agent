name: Interactive Probe (Browserbase)
# Like probe-source.yml, but simulates typing into a site's own search box
# and pressing Enter instead of relying on a URL query param -- for sites
# where a guessed `?param=value` renders the page shell but never triggers
# the real client-side search (confirmed on Christie's, Doyle).
on:
  push:
    paths:
      - 'interactive-probe-request.json'
      - 'bb-interactive-probe.js'
      - 'browserbase.js'
      - '.github/workflows/interactive-probe.yml'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to navigate to (site homepage or a page with a search box)'
        required: true
        type: string
      term:
        description: 'Search term to type'
        required: true
        type: string
      selectors:
        description: 'Comma-separated CSS selectors to try for the search input'
        required: true
        type: string
      open_selectors:
        description: 'Comma-separated CSS selectors for an optional "open search" trigger'
        type: string
        default: ''
      post_search_selectors:
        description: 'Comma-separated CSS selectors to click AFTER the search fires (e.g. a "Past lots" tab)'
        type: string
        default: ''
      html_grep:
        description: 'Comma-separated substrings to search for in the rendered HTML and print context around (for finding real selectors)'
        type: string
        default: ''
      wait_ms:
        description: 'Wait time in ms after pressing Enter'
        type: string
        default: '8000'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Resolve inputs
        id: resolve
        # Same class of bug as the "Interactive probe" step below: GitHub
        # substitutes ${{ }} expressions into the run script TEXT before bash
        # ever parses it, so a value containing a literal `"` (e.g. an
        # html_grep term like `"label":"Sold`) breaks the surrounding quoted
        # echo string regardless of how it's quoted -- confirmed via a live
        # CI failure ("unexpected EOF while looking for matching `"'"). Inputs
        # come in through env vars instead, which bash treats as opaque data.
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            {
              echo "base_url=$IN_BASE_URL"
              echo "term=$IN_TERM"
              echo "selectors=$IN_SELECTORS"
              echo "open_selectors=$IN_OPEN_SELECTORS"
              echo "post_search_selectors=$IN_POST_SEARCH_SELECTORS"
              echo "html_grep=$IN_HTML_GREP"
              echo "wait_ms=$IN_WAIT_MS"
            } >> "$GITHUB_OUTPUT"
          else
            node -e '
              const fs = require("fs");
              const r = require("./interactive-probe-request.json");
              fs.appendFileSync(process.env.GITHUB_OUTPUT,
                `base_url=${r.base_url}\nterm=${r.term}\nselectors=${r.selectors}\nopen_selectors=${r.open_selectors || ""}\npost_search_selectors=${r.post_search_selectors || ""}\nhtml_grep=${r.html_grep || ""}\nwait_ms=${r.wait_ms || 8000}\n`);
            '
          fi
        env:
          EVENT_NAME: ${{ github.event_name }}
          IN_BASE_URL: ${{ inputs.base_url }}
          IN_TERM: ${{ inputs.term }}
          IN_SELECTORS: ${{ inputs.selectors }}
          IN_OPEN_SELECTORS: ${{ inputs.open_selectors }}
          IN_POST_SEARCH_SELECTORS: ${{ inputs.post_search_selectors }}
          IN_HTML_GREP: ${{ inputs.html_grep }}
          IN_WAIT_MS: ${{ inputs.wait_ms }}
      - name: Interactive probe
        # Selectors can contain shell metacharacters (parens, quotes, commas
        # in :has-text('...')) -- interpolating GitHub expressions straight
        # into the run script (as a prior version of this step did) lets bash
        # parse them as syntax instead of literal text. Passing everything
        # through env vars and building an argv array with "$VAR" keeps each
        # value a single opaque string regardless of its contents.
        run: |
          ARGS=("$BASE_URL" "$TERM" "--selectors=$SELECTORS" "--wait=$WAIT_MS")
          if [ -n "$OPEN_SELECTORS" ]; then ARGS+=("--open-selectors=$OPEN_SELECTORS"); fi
          if [ -n "$POST_SEARCH_SELECTORS" ]; then ARGS+=("--post-search-selectors=$POST_SEARCH_SELECTORS"); fi
          if [ -n "$HTML_GREP" ]; then ARGS+=("--html-grep=$HTML_GREP"); fi
          node bb-interactive-probe.js "${ARGS[@]}"
        env:
          BASE_URL: ${{ steps.resolve.outputs.base_url }}
          TERM: ${{ steps.resolve.outputs.term }}
          SELECTORS: ${{ steps.resolve.outputs.selectors }}
          OPEN_SELECTORS: ${{ steps.resolve.outputs.open_selectors }}
          POST_SEARCH_SELECTORS: ${{ steps.resolve.outputs.post_search_selectors }}
          HTML_GREP: ${{ steps.resolve.outputs.html_grep }}
          WAIT_MS: ${{ steps.resolve.outputs.wait_ms }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interactive-probe-output
          path: probe-output/
          retention-days: 14
          if-no-files-found: warn
