name: Dealer Marketplaces Debug (1stDibs / The RealReal)
on:
  push:
    paths:
      - '1stdibs-listing-shape.js'
      - 'therealreal-listing-shape.js'
      - 'therealreal-plain-fetch-probe.js'
      - 'therealreal-round3-probe.js'
      - 'therealreal-round4-probe.js'
      - 'therealreal-algolia-probe.js'
      - 'import-therealreal.js'
      - 'test-therealreal.js'
      - 'backvault-model-probe.js'
      - 'backvault-crosscheck-probe.js'
      - '.github/workflows/dealer-marketplaces-debug.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: 1stDibs search-results real field shape
        if: hashFiles('1stdibs-listing-shape.js') != ''
        run: node 1stdibs-listing-shape.js
        env:
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
      - name: The RealReal -- plain fetch, no browser (free, no proxy)
        if: hashFiles('therealreal-plain-fetch-probe.js') != ''
        run: node therealreal-plain-fetch-probe.js
      - name: The RealReal -- round 3, reader proxy / wayback / UA tests (free)
        if: hashFiles('therealreal-round3-probe.js') != ''
        run: node therealreal-round3-probe.js
      - name: The RealReal -- round 4, r.jina.ai full page + pagination + product page (free)
        if: hashFiles('therealreal-round4-probe.js') != ''
        run: node therealreal-round4-probe.js
      - name: The RealReal -- re-verify real import-therealreal.js in isolation (no output/ writes)
        if: hashFiles('test-therealreal.js') != ''
        run: node test-therealreal.js
      - name: The RealReal -- Algolia direct-query probe (free, no proxy)
        if: hashFiles('therealreal-algolia-probe.js') != ''
        run: node therealreal-algolia-probe.js
      - name: The RealReal search-results real field shape (Browserbase/Steel, paid)
        if: hashFiles('therealreal-listing-shape.js') != ''
        run: node therealreal-listing-shape.js
        env:
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          STEEL_API_KEY: ${{ secrets.STEEL_API_KEY }}
      - name: The Back Vault -- single retailer or consignment marketplace? (free)
        if: hashFiles('backvault-model-probe.js') != ''
        run: node backvault-model-probe.js
      - name: The Back Vault -- trace 5 close-match candidates elsewhere (Browserbase, paid)
        if: hashFiles('backvault-crosscheck-probe.js') != ''
        run: node backvault-crosscheck-probe.js
        env:
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
