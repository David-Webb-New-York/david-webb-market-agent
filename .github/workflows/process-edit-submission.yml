name: Process Editor Submission
# Applies a curated edit submitted from the Vercel-hosted editor page
# (editor/index.html -> editor/api/submit-edit.js), which opens a labeled
# issue here instead of writing to the repo directly. See
# process-edit-submission.js for the actual merge logic.
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
  actions: write # to dispatch pages-deploy.yml after committing new data
jobs:
  process:
    if: contains(github.event.issue.labels.*.name, 'editor-submission')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Apply edit
        run: node process-edit-submission.js
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit result
        run: |
          git config user.name "market-agent"
          git config user.email "agent@davidwebb.local"
          git add output/
          git commit -m "Apply editor submission from issue #${{ github.event.issue.number }}" || echo "No changes to commit"
          git pull --rebase --autostash origin main
          git push

      - name: Deploy database GUI
        # A GITHUB_TOKEN-authored push doesn't trigger other workflows'
        # `on: push` (GitHub's own anti-recursion rule) -- dispatch the
        # redeploy explicitly, same as daily-alert.yml / dealer-refresh.yml.
        run: gh workflow run pages-deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
