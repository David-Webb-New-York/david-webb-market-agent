name: Weekly Auction History Refresh
# Runs every structured + Browserbase-backed auction-history importer
# (Rago, LiveAuctioneers, ...) into output/david-webb-auction-history.*.
# Sibling to dealer-refresh.yml.
#
# Also push-triggered on changes to the importer code itself so a feature
# branch can verify a new/edited adapter runs cleanly against the real
# internet (and real Browserbase) before merging (see probe-source.yml for
# why push, not just workflow_dispatch, is needed pre-merge).
on:
  schedule:
    - cron: '15 13 * * 1'  # Monday 8:15am ET (weekly-scan.yml runs 8:00, dealer-refresh.yml runs 8:30)
  workflow_dispatch:
    inputs:
      with_llm:
        description: 'Also run the LLM web-search sweep (costs ~$3-6; needs ANTHROPIC_API_KEY)'
        type: boolean
        default: false
      christies_max_pages:
        description: 'Christie''s: how many 20-lot search-result pages to fetch (~101 total for "david webb"; each page is its own Browserbase session). Default 10 for routine runs; set to 101 for an exhaustive one-time baseline.'
        type: string
        default: '10'
  push:
    paths:
      - 'import-liveauctioneers.js'
      - 'import-invaluable.js'
      - 'import-bonhams.js'
      - 'import-sothebys.js'
      - 'import-rago.js'
      - 'import-christies.js'
      - 'import-phillips.js'
      - 'import-doyle.js'
      - 'inline-state.js'
      - 'browserbase.js'
      - 'history-store.js'
      - 'import-all.js'
      - '.github/workflows/history-refresh.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install

      # Structured importers are free; --with-browserbase adds LiveAuctioneers
      # (costs a Browserbase session). --with-llm only on manual dispatch when
      # the broad (paid) web-search sweep is wanted.
      - name: Import auction history
        run: node import-all.js --with-browserbase --christies-max-pages="$CHRISTIES_MAX_PAGES" ${{ (github.event_name == 'workflow_dispatch' && inputs.with_llm) && '--with-llm' || '' }}
        env:
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHRISTIES_MAX_PAGES: ${{ (github.event_name == 'workflow_dispatch' && inputs.christies_max_pages) || '10' }}

      - name: Upload auction history (for pre-merge inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auction-history
          path: |
            output/david-webb-auction-history.json
            output/david-webb-auction-history.csv
          retention-days: 14
          if-no-files-found: warn

      - name: Commit history
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "market-agent"
          git config user.email "agent@davidwebb.local"
          git add output/
          git commit -m "Auction history refresh $(date +%F)" || echo "No changes to commit"
          git push

      # Publish the searchable database GUI (docs/) to Vercel with the data
      # just imported. VERCEL_TOKEN is a personal access token from
      # vercel.com/account/tokens; the project is created automatically on
      # first deploy if it doesn't exist yet. Data files are generated here,
      # not committed -- docs/ itself only holds the static app.
      - name: Build site data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p docs/data
          cp output/david-webb-auction-history.json docs/data/auction-history.json
          cp output/david-webb-dealer-listings.json docs/data/dealer-listings.json
          date -u +"%Y-%m-%dT%H:%M:%SZ" > docs/data/generated-at.txt
      - name: Deploy database GUI (Vercel)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN not set -- skipping GUI deploy (data import above still succeeded)."
            exit 0
          fi
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN" --cwd docs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # VERCEL_ORG_ID/VERCEL_PROJECT_ID let the CLI skip interactive
          # linking; unset on first run so it creates the project, then set
          # both from the printed .vercel/project.json (or the dashboard).
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
