name: Weekly Dealer Listings Refresh
# (retried after GitHub Actions incident on 2026-08-06 should be resolved)
# Structured, free (no API key) sweep of estate-jeweler / dealer inventory
# (Shopify /products.json, WooCommerce Store API, ...) into
# output/david-webb-dealer-listings.*. Sibling to history-refresh.yml.
#
# Also push-triggered on changes to the importer code itself so a feature
# branch can verify a new/edited adapter runs cleanly against the real
# internet before merging (see probe-source.yml for why push, not just
# workflow_dispatch, is needed pre-merge).
on:
  schedule:
    - cron: '30 13 * * 1'  # Monday 13:30 UTC (8:30am ET in winter / 9:30am ET in summer), 15 min after history-refresh.yml
  workflow_dispatch: {}
  push:
    paths:
      - 'import-dealers.js'
      - 'import-shopify.js'
      - 'import-woocommerce.js'
      - 'import-1stdibs.js'
      - 'import-sothebys-buynow.js'
      - 'import-therealreal.js'
      - 'dealer-store.js'
      - '.github/workflows/dealer-refresh.yml'
permissions:
  contents: write
  actions: write # to dispatch pages-deploy.yml after committing new data
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Import dealer listings
        run: node import-dealers.js
        env:
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
      - name: Upload dealer listings (for pre-merge inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dealer-listings
          path: |
            output/david-webb-dealer-listings.json
            output/david-webb-dealer-listings.csv
          retention-days: 14
          if-no-files-found: warn
      - name: Commit results
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "market-agent"
          git config user.email "agent@davidwebb.local"
          git add output/
          git commit -m "Dealer listings refresh $(date +%F)" || echo "No changes to commit"
          git pull --rebase --autostash origin main
          git push

      # See history-refresh.yml for why this can't just be pages-deploy.yml's
      # own push trigger (GITHUB_TOKEN-authored pushes don't cascade).
      - name: Deploy database GUI
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: gh workflow run pages-deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The weekly report (weekly-report.yml) needs BOTH this run's dealer
      # data AND history-refresh.yml's auction data committed first --
      # otherwise it's reading stale/partial data, which was the original
      # bug (the old weekly-scan.yml posted to Slack at 8:00am, 15-30 min
      # BEFORE these two refreshes even ran). This job is always the fast
      # one (no paid Browserbase/Steel sessions), so it waits here for the
      # same schedule's history-refresh.yml run to finish, then dispatches
      # the report explicitly -- same GITHUB_TOKEN-doesn't-cascade reason
      # as the pages-deploy dispatch above.
      - name: Wait for auction-history refresh, then generate weekly report
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          for i in $(seq 1 40); do
            status=$(gh run list --workflow=history-refresh.yml --branch=main --limit=1 --json status --jq '.[0].status')
            echo "history-refresh.yml status: ${status:-unknown} (check $i/40)"
            if [ "$status" = "completed" ]; then break; fi
            sleep 60
          done
          gh workflow run weekly-report.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
